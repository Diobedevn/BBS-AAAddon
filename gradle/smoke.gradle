sourceSets {
    portSmoke {
        java.srcDir file("build/validation/${minecraft_version}/${providers.gradleProperty('smokeHost').getOrElse('cml')}-${providers.gradleProperty('smokeSide').getOrElse('client')}-sources")
        resources.srcDir file("build/validation/${minecraft_version}/${providers.gradleProperty('smokeHost').getOrElse('cml')}-${providers.gradleProperty('smokeSide').getOrElse('client')}-resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
sourceSets.portSmoke.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.client.runtimeClasspath += sourceSets.portSmoke.output
sourceSets.main.runtimeClasspath += sourceSets.portSmoke.output
loom {
    mods { addon_port_smoke { sourceSet sourceSets.portSmoke } }
    runs {
        client { runDir file(providers.gradleProperty('game_directory').getOrElse("build/validation/${minecraft_version}/client")).absolutePath }
        server { runDir file(providers.gradleProperty('game_directory').getOrElse("build/validation/${minecraft_version}/server")).absolutePath }
    }
}
['runClient', 'runServer'].each { name -> tasks.named(name) { dependsOn tasks.named('portSmokeClasses') } }
def runtimeFile = file('gradle/local-runtime.properties')
def runtimes = new Properties()
if (runtimeFile.isFile()) runtimeFile.withInputStream { runtimes.load(it) }
def runtimeHome = providers.gradleProperty('runJavaHome').orNull ?: runtimes.getProperty('runJavaHome.' + minecraft_version)
if (runtimeHome == null) throw new GradleException('Set -PrunJavaHome or gradle/local-runtime.properties for the matching client Java version.')
tasks.withType(JavaExec).configureEach { executable = new File(runtimeHome, 'bin/java.exe') }

def smokeHost = providers.gradleProperty('smokeHost').getOrElse('cml')
if (smokeHost != 'cml') {
    sourceSets.portSmoke.compileClasspath += files("build/${smokeHost}-compat/${minecraft_version}/classes-build/classes/java/main",
        "build/${smokeHost}-compat/${minecraft_version}/classes-build/classes/java/client")
}
if (providers.gradleProperty('distributionSmoke').isPresent()) {
    [tasks.named('runClient'), tasks.named('runServer')].each { task -> task.configure {
        def excluded = (sourceSets.main.output.files + sourceSets.client.output.files).collect { it.canonicalFile }
        classpath = classpath.filter { !excluded.contains(it.canonicalFile) }
    } }
}

tasks.named('compilePortSmokeJava') { dependsOn { tasks.findAll { it.name in ['compileFsCompatibility', 'compileBbs2Compatibility'] } } }
