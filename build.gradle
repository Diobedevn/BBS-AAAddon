plugins {
    id 'fabric-loom' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'maven-publish'
}
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'buildAll' }) {
    apply from: 'gradle/build-all.gradle'
    return
}
apply from: 'gradle/minecraft-targets.gradle'
def target = minecraftTarget
def official = target.namespace == 'official'
apply plugin: official ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
ext.set('fabric.loom.runtimeJavaCompatibilityVersion', target.java.toString())
if (providers.gradleProperty('fsCompileOnly').isPresent()) {
    def hosts = new groovy.json.JsonSlurper().parse(file('gradle/fs-hosts.json'))
    def fs = hosts.targets[minecraft_version]
    if (fs == null) throw new GradleException("No FS host for ${minecraft_version}")
    ext.localCmlJar = file("build/fs-compat/${minecraft_version}/${fs.filename}")
} else {
    apply from: 'gradle/local-cml.gradle'
}
version = project.mod_version + '-' + minecraft_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        if (!providers.gradleProperty('distributionSmoke').isPresent()) {
            'bbs-aaaddon' { sourceSet sourceSets.main; sourceSet sourceSets.client }
        }
    }
}
if (official) {
    /* Identifier retained its simple name and member signatures. Only its package moved.
     * All changed native calls live in the selected adapter, not this alias bridge. */
    def prepare = tasks.register('prepareOfficialSources', Sync) {
        from('src/client/java') {
            filter { line -> line.replace('import net.minecraft.util.Identifier;', 'import net.minecraft.resources.Identifier;') }
        }
        into file('build/source-bridge/official/client')
    }
    sourceSets.client.java.setSrcDirs([file('build/source-bridge/official/client')])
    tasks.named('compileClientJava') { dependsOn prepare }
}
sourceSets.client.java.srcDir "src/platform/${target.adapter}/client/java"
if (!official) sourceSets.client.java.srcDir 'src/platform/previewLegacy/client/java'
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!official) mappings "net.fabricmc:yarn:${target.mappings}:v2"
    def scope = official ? 'implementation' : 'modImplementation'
    add(scope, "net.fabricmc:fabric-loader:${target.loader}")
    add(scope, "net.fabricmc.fabric-api:fabric-api:${target.fabric}")
    if (providers.gradleProperty('distributionSmoke').isPresent()) {
        add('modCompileOnly', files(localCmlJar))
        def fs = new groovy.json.JsonSlurper().parse(file('gradle/fs-hosts.json')).targets[minecraft_version]
        def host = providers.gradleProperty('smokeHost').getOrElse('cml')
        add('modRuntimeOnly', files(host == 'fs' ? file("build/fs-compat/${minecraft_version}/${fs.filename}") : localCmlJar))
        add('modRuntimeOnly', files("build/libs/${base.archivesName.get()}-${project.version}.jar"))
    } else {
        add(scope, files(localCmlJar))
    }
    add(scope, "maven.modrinth:sodium:${target.sodium}")
    add(scope, "maven.modrinth:iris:${target.iris}")
    add(scope, 'org.anarres:jcpp:1.4.14')
    add(scope, "io.github.douira:glsl-transformer:${official ? '3.0.0-pre3' : '2.0.0-pre13'}")
    add(scope, "maven.modrinth:aaa-particles:${target.aaa}")
    if (!official) {
        add(scope, "dev.architectury:architectury-fabric:${target.architectury}")
        add(scope, "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${target.forgeconfig}")
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = target.java }
java { sourceCompatibility = JavaVersion.toVersion(target.java); targetCompatibility = JavaVersion.toVersion(target.java) }
processResources {
    def values = [version: project.version, minecraft_version: minecraft_version, java_version: target.java]
    inputs.properties values
    filesMatching('fabric.mod.json') { expand values }
    filesMatching('bbs-aaaddon.client.mixins.json') { expand java_version: target.java }
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
def production = tasks.named(official ? 'jar' : 'remapJar')
tasks.register('collectReleaseJar', Copy) { dependsOn production; from production.flatMap { it.archiveFile }; into file('build/libs') }
tasks.named('build') { dependsOn 'collectReleaseJar' }

if (providers.gradleProperty('portSmoke').isPresent()) apply from: 'gradle/smoke.gradle'

apply from: 'gradle/fs-compat.gradle'
